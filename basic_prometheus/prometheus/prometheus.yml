global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - 'alertmanager:9093'  # Service name in docker-compose

# Load rules from this file
rule_files:
  - "rules.yml"

# Scrape configurations
scrape_configs:
  # Job 1: Your Go application
  - job_name: 'go-app'
    scrape_interval: 5s  # Faster interval for critical app
    static_configs:
      - targets: ['go-app:8080']
        labels:
          application: 'go-api'
          environment: 'development'

  # Job 2: Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          application: 'prometheus'
          environment: 'development'
          team: 'backend'