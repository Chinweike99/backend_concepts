groups:
  # ============ RECORDING RULES ============
  - name: api_recording_rules
    interval: 30s
    rules:
      # Request rate per endpoint (per second)
      - record: api:request_rate:1m
        expr: sum(rate(http_requests_total[1m])) by (endpoint)
      
      # Request rate per endpoint and status
      - record: api:request_rate_by_status:1m
        expr: sum(rate(http_requests_total[1m])) by (endpoint, status)
      
      # Error rate percentage (overall)
      - record: api:error_rate:1m
        expr: sum(rate(http_requests_total{status=~"4..|5.."}[1m])) / sum(rate(http_requests_total[1m])) * 100
      
      # Error rate per endpoint
      - record: api:error_rate_by_endpoint:1m
        expr: sum(rate(http_requests_total{status=~"4..|5.."}[1m])) by (endpoint) / sum(rate(http_requests_total[1m])) by (endpoint) * 100
      
      # 50th percentile latency (median)
      - record: api:p50_latency:5m
        expr: histogram_quantile(0.50, sum(rate(http_request_duration_bucket[5m])) by (le))
      
      # 95th percentile latency
      - record: api:p95_latency:5m
        expr: histogram_quantile(0.95, sum(rate(http_request_duration_bucket[5m])) by (le))
      
      # 99th percentile latency
      - record: api:p99_latency:5m
        expr: histogram_quantile(0.99, sum(rate(http_request_duration_bucket[5m])) by (le))
      
      # Active requests (current)
      - record: api:active_requests:current
        expr: active_requests

  # ============ ALERTING RULES ============
  - name: api_alerting_rules
    interval: 15s
    rules:
      # Alert: High error rate
      - alert: HighErrorRate
        expr: api:error_rate:1m > 1
        for: 3m
        labels:
          severity: critical
          team: backend
        annotations:
          summary: "High error rate detected"
          description: "Error rate is {{ $value }}% for the last 3 minutes. Check the logs immediately."
      
      # Alert: Very high error rate (more urgent)
      - alert: VeryHighErrorRate
        expr: api:error_rate:1m > 20
        for: 1m
        labels:
          severity: critical
          team: backend
        annotations:
          summary: "CRITICAL: Very high error rate"
          description: "Error rate is {{ $value }}% for the last 1 minute. Immediate action required!"
      
      # Alert: Service is down
      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
          team: backend
        annotations:
          summary: "Service is down"
          description: "The service {{ $labels.job }} has been down for 1 minute. Check the pod status."
      
      # Alert: No traffic (service may be misconfigured)
      - alert: NoTraffic
        expr: sum(rate(http_requests_total[5m])) == 0
        for: 10m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "No traffic detected"
          description: "Zero requests in the last 10 minutes. The service may not be receiving traffic."
      
      # Alert: High latency (p95 > 1 second)
      - alert: HighLatency
        expr: api:p95_latency:5m > 1
        for: 5m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "High latency detected"
          description: "95th percentile latency is {{ $value }}s for the last 5 minutes. Users may be experiencing slowness."
      
      # Alert: Very high latency (p99 > 2 seconds)
      - alert: VeryHighLatency
        expr: api:p99_latency:5m > 2
        for: 2m
        labels:
          severity: critical
          team: backend
        annotations:
          summary: "CRITICAL: Very high latency"
          description: "99th percentile latency is {{ $value }}s for the last 2 minutes. User experience is severely impacted."
      
      # Alert: High active requests (possible bottleneck)
      - alert: HighActiveRequests
        expr: active_requests > 50
        for: 2m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "High number of active requests"
          description: "There are {{ $value }} active requests. The service may be overloaded."