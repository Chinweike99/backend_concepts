# Global configuration
global:
  resolve_timeout: 5m
  # Email configuration (replace with your SMTP settings)
  smtp_smarthost: 'smtp.gmail.com:587'
  smtp_from: 'mail56382cd@gmail.com'
  smtp_auth_username: 'mail56382cd@gmail.com'
  smtp_auth_password: 'your-app-password'  # Use app-specific password
  smtp_require_tls: true

# Root route
route:
  group_by: ['alertname', 'namespace', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'default-receiver'
  
  # Child routes
  routes:
    # Critical alerts → PagerDuty (or webhook)
    - match:
        severity: 'critical'
      receiver: 'critical-receiver'
      continue: true
    
    # Warning alerts → Slack
    - match:
        severity: 'warning'
      receiver: 'slack-receiver'
      continue: true
    
    # Service down alerts → different receiver
    - match:
        alertname: 'ServiceDown'
      receiver: 'pagerduty-receiver'

# All receivers
receivers:
  - name: 'default-receiver'
    email_configs:
      - to: 'innocentakwolu1@gmail.com'
        send_resolved: true

  - name: 'critical-receiver'
    webhook_configs:
      - url: 'http://localhost:8080/webhook'  # For testing
        send_resolved: true
    email_configs:
      - to: 'oncall@yourcompany.com'
        send_resolved: true

  - name: 'slack-receiver'
    slack_configs:
      - api_url: 'https://hooks.slack.com/services/YOUR/WEBHOOK/URL'
        channel: '#alerts'
        title: '⚠️ {{ .GroupLabels.alertname }}'
        text: |
          *Severity:* {{ .CommonLabels.severity }}
          *Description:* {{ .CommonAnnotations.description }}
          *Summary:* {{ .CommonAnnotations.summary }}
          *Graph:* <{{ .ExternalURL }}/graph?{{ .CommonLabels | queryEscape }}|View in Prometheus>
        send_resolved: true

  - name: 'pagerduty-receiver'
    pagerduty_configs:
      - service_key: 'your-pagerduty-service-key'
        send_resolved: true

# Inhibition rules
inhibit_rules:
  # If critical alert is firing, don't send warning for same alert
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname']
  
  # If service is down, don't send endpoint alerts
  - source_match:
      alertname: 'ServiceDown'
    target_match:
      alertname: 'EndpointDown'
    equal: ['namespace']