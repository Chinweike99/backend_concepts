apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: monitoring
data:
  alertmanager.yml: |
    global:
      resolve_timeout: 5m
      # SMTP configuration (replace with yours)
      smtp_smarthost: 'smtp.gmail.com:587'
      smtp_from: 'mail66838vs@gmail.com'
      smtp_auth_username: 'mail66838vs@gmail.com'
      smtp_auth_password: 'your-app-password'
      smtp_require_tls: true

    route:
      group_by: ['alertname', 'namespace']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      receiver: 'default-receiver'
      
      routes:
        - match:
            severity: 'critical'
          receiver: 'critical-receiver'
          continue: true
        
        - match:
            severity: 'warning'
          receiver: 'slack-receiver'

    receivers:
      - name: 'default-receiver'
        email_configs:
          - to: 'team@yourcompany.com'
            send_resolved: true

      - name: 'critical-receiver'
        webhook_configs:
          - url: 'http://webhook-service:8080/webhook'
            send_resolved: true
        email_configs:
          - to: 'oncall@yourcompany.com'
            send_resolved: true

      - name: 'slack-receiver'
        slack_configs:
          - api_url: 'https://hooks.slack.com/services/YOUR/WEBHOOK/URL'
            channel: '#alerts'
            title: '⚠️ {{ .GroupLabels.alertname }}'
            text: |
              *Severity:* {{ .CommonLabels.severity }}
              *Namespace:* {{ .CommonLabels.kubernetes_namespace }}
              *Description:* {{ .CommonAnnotations.description }}
              *Summary:* {{ .CommonAnnotations.summary }}
            send_resolved: true

    inhibit_rules:
      - source_match:
          severity: 'critical'
        target_match:
          severity: 'warning'
        equal: ['alertname', 'kubernetes_namespace']