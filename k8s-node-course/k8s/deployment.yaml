apiVersion: apps/v1

kind: Deployment

metadata:
  name: backend-deployment

spec:
  replicas: 3

  selector:
    matchLabels:
      app: backend

  template:

    metadata:
      labels:
        app: backend

    spec:

      containers:

      - name: backend-container

        image: k8s-node-course:v1

        imagePullPolicy: Never

        ports:

        - containerPort: 3000
