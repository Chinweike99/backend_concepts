apiVersion: apps/v1

kind: Deployment

metadata:
  name: backend-deployment

spec:
  replicas: 3

  selector:
    matchLabels:
      app: backend-pod

  template:
    metadata:
      labels:
        app: backend-pod

    spec:
      containers:
        - name: backend-container
          image: lab-backend:v2
          imagePullPolicy: Never
          ports:
            - containerPort: 8080

          env:
            - name: APP_VERSION
              value: "1.0.0"
            
            - name: APP_ENV
              value: "development"