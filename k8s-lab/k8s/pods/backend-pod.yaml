apiVersion: v1

kind: Pod

metadata:
  name: backend-pod

spec:
  containers:
    - name: backend-container
      image: lab-backend:v1
      imagePullPolicy: Never
      ports:
        - containerPort: 8080

      env:
        - name: APP_VERSION
          value: "1.0.0"
        
        - name: APP_ENV
          value: "development"